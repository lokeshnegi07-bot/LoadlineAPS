  const k = fid + '|' + d, a = (S.actuals || {})[k], c = R.carry[k], planned = R.load[k] || 0;
  const res = !c ? '<span class="muted small">Not recorded yet</span>' : c.gap ? `<span class="pill bad">${c.gap} short, moved to ${fmt(c.to)}</span>` : c.actual > c.planned ? `<span class="pill ok">${c.actual - c.planned} above plan</span>` : '<span class="pill ok">On plan</span>';
  return `<div class="row actrow">${multiPlant() ? `<b>${esc(factoryName(fid))}</b>` : ''}<span>Made</span><input type="number" min="0" step="1" class="w70" value="${a ? a.actual : ''}" aria-label="Units actually made on ${fmt(d)}"><span class="muted">of ${planned} planned</span><button class="btn sm primary" data-actsave="${esc(k)}">Save actual</button>${a ? `<button class="btn sm" data-actdel="${esc(k)}">Clear</button>` : ''}${res}</div>`;
}
const carriedTotal = (fids, from) => Object.entries(R.cin).filter(([k]) => fids.includes(k.split('|')[0]) && k.split('|')[1] >= from).reduce((a, [, v]) => a + v, 0);

/* ---------- chart ---------- */
function chartSVG(fids) {
  const { lo, hi } = rangeFor(fids);
  const n = diffDays(lo, hi) + 1;
  const base = { day:26, week:11, month:5 }[UI.zoom];
  const padL = 40, top = 30, plotH = Math.round(Math.max(220, Math.min(700, innerHeight - 362))), bottom = 26;
  const avail = (document.getElementById('main')?.clientWidth || innerWidth) - 64 - padL - 56;
  const dw = UI.zoom === 'day' ? base : Math.max(base, avail / n); chartSVG.dw = dw;
  const days = Array.from({ length:n }, (_, i) => addDays(lo, i));
  const info = days.map(d => dayInfo(d, fids));
  // scale to usable capacity (after machine and manpower availability), not raw plant slots
  let ymax = Math.max(1, ...info.map(x => x.load), ...info.map(x => x.cap)) + 2;
  ymax = Math.ceil(ymax / 2) * 2;
  const W = padL + n * dw + 56, H = top + plotH + bottom;
  const y = v => top + plotH - (v / ymax) * plotH, uh = plotH / ymax;
  const today = localToday();
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Day-wise loading chart">
  <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--closed)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="3"/></pattern>
  <pattern id="bomh" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--surface)" stroke-width="2" stroke-opacity=".7"/></pattern>
  <pattern id="carryp" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--bad-soft)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--bad)" stroke-width="2.6"/></pattern></defs>`;
  const step = ymax <= 12 ? 2 : ymax <= 30 ? 4 : 10;
  for (let v = 0; v <= ymax; v += step) s += `<line x1="${padL}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v ? .6 : 1}"/><text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" class="num">${v}</text>`;
  days.forEach((d, i) => {
    const x = padL + i * dw, it = info[i];
    if (it.cap === 0) s += `<rect x="${x}" y="${top}" width="${dw}" height="${plotH}" fill="url(#hatch)" opacity=".8"/>`;
    const dd = D(d).getUTCDate();
    if (dd === 1 || i === 0) { s += `<line x1="${x}" x2="${x}" y1="${top - 18}" y2="${top + plotH}" stroke="var(--line)"/><text x="${x + 4}" y="${top - 8}" style="font-weight:600;fill:var(--ink)">${MON[D(d).getUTCMonth()]} ${D(d).getUTCFullYear()}</text>`; }
    if (UI.zoom === 'day') s += `<text x="${x + dw / 2}" y="${top + plotH + 15}" text-anchor="middle" class="num" style="${dow(d) === 1 ? 'fill:var(--ink)' : ''}">${dd}</text>`;
    else if (UI.zoom === 'week' && dow(d) === 1) s += `<text x="${x}" y="${top + plotH + 15}" class="num">${dd}</text>`;
    let acc = 0;
    it.segs.forEach(sg => {
      const o = refInfo(sg.ref); if (!o) return;
      const h = sg.units * uh, yy = y(acc + sg.units);
      const fill = sg.kind === 'running' ? 'var(--running)' : sg.kind === 'carry' ? 'url(#carryp)' : FRAME_COLOR(o.frame);
      const tip = o.carry ? `${sg.units} unit${sg.units > 1 ? 's' : ''} pending from ${fmt(o.from)} (planned ${o.planned}, made ${o.actual}), moved to this day`
        : `${sg.ref.replace('RUN:', '')} · WO ${o.wo} · ${o.type} frame ${o.frame} · ${o.kw} kW · ${sg.units} unit${sg.units > 1 ? 's' : ''} in process` + (sg.kind === 'running' ? ' · already running' : sg.kind === 'bom' ? ' · BOM pending (tentative)' : sg.kind === 'override' ? ' · FG date edited' : sg.kind === 'firm' ? ' · in production, sent to ERP' : '');
      s += `<rect x="${x + 1}" y="${yy}" width="${Math.max(dw - 2, 1)}" height="${h}" fill="${fill}" stroke="${sg.kind === 'carry' ? 'var(--bad)' : 'var(--surface-2)'}" stroke-width="${dw > 8 ? .8 : 0}"><title>${esc(tip)}</title></rect>`;
      if (sg.kind === 'bom') s += `<rect x="${x + 1}" y="${yy}" width="${Math.max(dw - 2, 1)}" height="${h}" fill="url(#bomh)" pointer-events="none"/>`;
      if (sg.kind === 'override' && dw > 8) s += `<rect x="${x + 1.5}" y="${yy + .5}" width="${dw - 3}" height="${h - 1}" fill="none" stroke="var(--ink)" stroke-width="1.2" pointer-events="none"/>`;
      acc += sg.units;
    });
    if (it.cap > 0) s += `<line x1="${x}" x2="${x + dw}" y1="${y(it.cap)}" y2="${y(it.cap)}" stroke="var(--accent)" stroke-width="2.2"/>`;
    if (it.load > it.cap) s += `<path d="M${x + dw / 2 - 4} ${y(it.load) - 9} h8 l-4 6z" fill="var(--bad)"><title>Overloaded: ${it.load} units on capacity ${it.cap}</title></path>`;
    // actual output: black line at the units made, "−N" short of plan; "+N" pending carried in from the previous working day
    const acts = fids.map(f => R.carry[f + '|' + d]).filter(Boolean), made = acts.reduce((a, c) => a + c.actual, 0), short = acts.reduce((a, c) => a + c.gap, 0);
    const cinN = fids.reduce((a, f) => a + (R.cin[f + '|' + d] || 0), 0);
    if (acts.length) s += `<line x1="${x + 1}" x2="${x + dw - 1}" y1="${y(made)}" y2="${y(made)}" stroke="var(--ink)" stroke-width="2.6" pointer-events="none"/>`;
    if ((short || cinN) && dw >= 16) {
      const yt = y(Math.max(it.load, it.cap)) - (it.load > it.cap ? 13 : 5);
      [cinN ? '+' + cinN : '', short ? '−' + short : ''].filter(Boolean).reverse().forEach((lb, j) => s += `<text x="${x + dw / 2}" y="${yt - j * 12}" text-anchor="middle" class="num" style="fill:var(--bad);font-weight:600" pointer-events="none">${lb}</text>`);
    }
    if (d === UI.selDay) s += `<rect x="${x}" y="${top}" width="${dw}" height="${plotH}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
    const extra = (cinN ? ` · ${cinN} pending from previous day` : '') + (acts.length ? ` · made ${made}` + (short ? `, ${short} short, moved to ${fmt(acts.find(c => c.gap).to)}` : ', on plan') : '');
    s += `<rect class="hit" data-day="${d}" x="${x}" y="${top}" width="${dw}" height="${plotH}"><title>${fmt(d)} · planned ${it.load} / capacity ${it.cap}${extra}</title></rect>`;
  });
  const ti = diffDays(lo, today);
  if (ti >= 0 && ti < n) { const x = padL + ti * dw + dw / 2; s += `<line x1="${x}" x2="${x}" y1="${top - 4}" y2="${top + plotH}" stroke="var(--ink)" stroke-dasharray="3 3" pointer-events="none"/><text x="${x + 3}" y="${top + 10}" style="fill:var(--ink)">Today</text>`; }
  s += `<text x="4" y="${top + plotH / 2}" transform="rotate(-90 10 ${top + plotH / 2})" text-anchor="middle">Units in process</text>`;
  // fixed y-axis drawn over the scrolling chart so the scale stays visible
  let ax = `<svg class="yaxis" width="${padL}" height="${H}" aria-hidden="true"><rect width="${padL}" height="${H}" fill="var(--surface-2)"/>`;
  for (let v = 0; v <= ymax; v += step) ax += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" class="num">${v}</text>`;
  chartSVG.axis = ax + `<text x="4" y="${top + plotH / 2}" transform="rotate(-90 10 ${top + plotH / 2})" text-anchor="middle">Units in process</text></svg>`;
  return s + '</svg>';
}

function dayPanel(d, it) {

function issuesPanel(issues, open) {

function viewCalendar() {

  const months = []; let d = lo.slice(0, 8) + '01';
  while (d <= hi) { months.push(d); const dt = D(d); dt.setUTCMonth(dt.getUTCMonth() + 1); d = iso(dt); }
  const cal = S.calendar[fid] || (S.calendar[fid] = {});
  const sel = UI.calDay, e = sel ? cal[sel] || {} : null;
  const f = S.factories.find(x => x.id === fid);

    const first = D(m), y = first.getUTCFullYear(), mo = first.getUTCMonth();
    const dim = new Date(Date.UTC(y, mo + 1, 0)).getUTCDate(); const lead = (first.getUTCDay() + 6) % 7;
    let g = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x => `<div class="dh">${x}</div>`).join('') + '<div></div>'.repeat(lead);
    for (let i = 1; i <= dim; i++) {

      const pct = cap ? Math.min(100, ld / cap * 100) : 0;

      const tip = (ci ? ` · ${ci} pending from previous day` : '') + (cg ? ` · made ${cg.actual} of ${cg.planned}` + (cg.gap ? `, ${cg.gap} moved to ${fmt(cg.to)}` : '') : '');

function viewShop() {

  const down = ms.filter(x => isDown(x.m, today)).length, pct = Math.round(machinePct(fid, today));
  if (!UI.actDate || UI.actDate > today) UI.actDate = prevWorking(fid, addDays(today, -1));
  const nextId = 'M' + String(S.machines.reduce((mx, m) => Math.max(mx, parseInt(m.id.slice(1), 10) || 0), 0) + 1).padStart(2, '0');

function filterTable(tb) {

function howCalc(o, r) {
  const rule = S.leadRules.find(x => +x.frame === +o.frame) || {};
  const kwAdd = +o.kw > +S.adders.kwOver ? +S.adders.kwDays : 0, hvAdd = +o.volts >= +S.adders.hvVolts ? +S.adders.hvDays : 0;
  const earliest = r.earliest || nextWorking(r.fid, addDays(localToday(), 1));
  const wd = (x, y) => { let n = 0; for (let d = addDays(x, 1); d <= y; d = addDays(d, 1)) if (capOn(r.fid, d) > 0) n++; return n; };
  const pl = n => `${n} working day${n === 1 ? '' : 's'}`;
  let loadHead, loadSub;
  if (o.override) { loadHead = 'Fixed by override'; loadSub = 'The plant set this date by hand'; }
  else if (r.kind === 'firm') { loadHead = 'In production, dates held'; loadSub = `Sent to ERP ${fmtAt(S.sent[o.so].at)} and started ${fmt(r.start)}, so it is no longer re-planned`; }
  else if (!r.target) { const w = wd(earliest, r.start) + (r.start > earliest ? 1 : 0); loadHead = w ? `No marketing date, waited ${pl(w)} for a free slot` : 'No marketing date, started at the first free slot'; loadSub = 'Planned as early as possible'; }
  else if (r.end === r.target) { loadHead = 'Finishes on the marketing date'; loadSub = `Start is set back from ${fmt(o.sales)} by the lead time`; }
  else if (r.end < r.target) { loadHead = `${pl(wd(r.end, r.target))} before the marketing date`; loadSub = 'Days before the marketing date are full, so it uses free capacity earlier'; }
  else { const tooSoon = spanBack(r.fid, r.target, r.L)[0] < earliest; loadHead = `${pl(wd(r.target, r.end))} after the marketing date`; loadSub = tooSoon && r.start === earliest ? `Marketing date is too close: the earliest possible start is ${fmt(earliest)}` : 'Factory is full until then with running jobs and orders that have earlier marketing dates'; }
  let closed = 0; for (let d = r.start; d <= r.end; d = addDays(d, 1)) if (capOn(r.fid, d) === 0) closed++;
  const f = S.factories.find(x => x.id === r.fid) || {};
  return `<div class="card" style="display:grid;gap:8px;background:var(--surface-2)"><h3>How the FG date was calculated</h3>
    <div class="kv">
      <div><span>1 · Motor configuration</span><b>${r.L} working days per motor</b><span class="muted">Frame ${o.frame}: ${rule.days || '?'} d${kwAdd ? ` + ${kwAdd} d (KW over ${S.adders.kwOver})` : ''}${hvAdd ? ` + ${hvAdd} d (${S.adders.hvVolts} V or more)` : ''}${+S.shopFloor.riskDays ? ` + ${S.shopFloor.riskDays} d risk buffer` : ''} · qty ${o.qty}</span></div>
      <div><span>2 · Factory loading</span><b>${loadHead}</b><span class="muted">${loadSub} · ${capOn(r.fid, nextWorking(r.fid, localToday()))} of ${f.capacity} slots usable today (machines ${Math.round(machinePct(r.fid, nextWorking(r.fid, localToday())))}%, manpower ${S.shopFloor.manpowerPct}%)${carriedTotal([r.fid], localToday()) ? ` · ${carriedTotal([r.fid], localToday())} units pending from previous days go first` : ''}</span></div>
      <div><span>3 · Factory calendar</span><b>${closed} non-working day${closed === 1 ? '' : 's'} skipped</b><span class="muted">Between start ${fmt(r.start)} and FG ${fmt(r.end)} (weekends, holidays, shutdowns)</span></div>
    </div></div>`;
}

function fitGrids() {

function leadImportPanel() {
  const r = UI.leadImport; if (!r) return '';

function importLeadRows(rows, fileName, mode) {
  const keys = Object.keys(rows[0] || {});
  const find = list => keys.find(k => list.includes(normKey(k)));
  const kf = find(LEAD_ALIASES.frame), kd = find(LEAD_ALIASES.days);
  if (!kf || !kd) { toast(`Couldn't find ${!kf ? 'a Frame' : ''}${!kf && !kd ? ' and ' : ''}${!kd ? 'a Days per motor' : ''} column. Columns found: ${keys.join(', ') || 'none'}.`); return; }
  const issues = [], seen = {}, valid = [];
  rows.forEach((row, i) => {
    const line = i + 2, fRaw = String(row[kf] ?? '').trim(), dRaw = String(row[kd] ?? '').trim();
    if (!fRaw && !dRaw) return;
    const frame = Number(fRaw.replace(/[^0-9.]/g, '')), days = Number(dRaw);
    if (!fRaw) return issues.push({ line, frame:'', msg:'Frame is missing' });
    if (!Number.isInteger(frame) || frame <= 0) return issues.push({ line, frame:fRaw, msg:'Frame must be a whole number, e.g. 355' });
    if (!dRaw) return issues.push({ line, frame:fRaw, msg:'Days per motor is missing' });

    seen[frame] = line; valid.push({ frame, days });

    removed = before.filter(r => !seen[+r.frame]).length;

  }
  S.leadRules.sort((a, b) => a.frame - b.frame);
  const orphans = [...new Set(S.orders.map(o => +o.frame).filter(f => f && !S.leadRules.some(r => +r.frame === f)))].sort((a, b) => a - b);
  UI.leadImport = { file:fileName, added, updated, removed, same, issues, orphans };
  render(); toast(`Lead time master: ${added} added, ${updated} updated${removed ? `, ${removed} removed` : ''}. Plan recalculated.`);
}
function readLeadFile(file) {

    try {
      const wb = XLSX.read(new Uint8Array(fr.result), { type:'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'', raw:true });
      if (!rows.length) { toast('That sheet has no rows under the header.'); return; }
      importLeadRows(rows, file.name, UI.leadMode === 'replace' ? 'replace' : 'merge');
    } catch (e) { toast('Could not read that file. Use .xlsx, .xls or .csv.'); }
  };
  fr.readAsArrayBuffer(file);
}
